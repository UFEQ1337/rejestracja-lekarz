# Profil developerski: baza H2 w pamieci (bez Dockera), konsola H2 pod /h2-console
spring:
  datasource:
    url: jdbc:h2:mem:przychodnia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
